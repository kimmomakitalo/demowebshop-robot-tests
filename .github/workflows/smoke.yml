name: Smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # "Run workflow" button in the Actions tab

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          rfbrowser init --with-deps chromium

      - name: Run tests
        run: robot --outputdir results --variable HEADLESS:True tests

      - name: Upload results
        if: always()   # keep the report also when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/
